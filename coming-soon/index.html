<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Byurhan — Coming soon</title>
    <meta
      name="description"
      content="Personal site of Byurhan — developer, tinkerer, homelabber. New home for writing, projects, and experiments. Coming soon."
    />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#0d0e11" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- Open Graph -->
    <meta property="og:title" content="Byurhan — Coming soon" />
    <meta
      property="og:description"
      content="A new home for my writing, projects, and experiments. Coming soon."
    />
    <meta property="og:type" content="website" />

    <!-- Favicon: orange dot -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='%23FF4F00'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #0d0e11;
        --fg: #f4f4f5;
        --muted: rgba(244, 244, 245, 0.55);
        --faint: rgba(244, 244, 245, 0.32);
        --line: rgba(244, 244, 245, 0.12);
        --accent: #ff4f00;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --fg: #18181b;
          --muted: rgba(24, 24, 27, 0.6);
          --faint: rgba(24, 24, 27, 0.4);
          --line: rgba(24, 24, 27, 0.1);
        }
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        display: grid;
        place-items: center;
        min-height: 100svh;
        padding: 2rem;
      }

      main {
        width: 100%;
        max-width: 36rem;
        animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .eyebrow {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
          monospace;
        font-size: 0.72rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--faint);
        margin: 0 0 1.75rem;
      }

      h1 {
        font-family:
          "Space Grotesk", ui-sans-serif, system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: clamp(3rem, 11vw, 5.25rem);
        line-height: 1;
        letter-spacing: -0.03em;
        margin: 0;
      }
      h1 .dot {
        color: var(--accent);
      }

      .tagline {
        margin: 1.5rem 0 0;
        font-size: clamp(1rem, 2.4vw, 1.2rem);
        line-height: 1.6;
        color: var(--muted);
        max-width: 28rem;
      }
      .tagline em {
        font-style: normal;
        font-weight: 500;
        color: var(--fg);
      }

      .rule {
        height: 1px;
        background: var(--line);
        margin: 2.5rem 0 1.5rem;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 1.25rem;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
          monospace;
        font-size: 0.78rem;
        letter-spacing: 0.04em;
      }
      nav a {
        color: var(--muted);
        text-decoration: none;
        transition: color 0.18s ease;
      }
      nav a:hover {
        color: var(--accent);
      }

      footer {
        margin-top: 2.5rem;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
          monospace;
        font-size: 0.7rem;
        letter-spacing: 0.04em;
        color: var(--faint);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        main {
          animation: none;
        }
        nav a {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">byurhannurula.com</p>
      <h1>byurhan<span class="dot">.</span></h1>
      <p class="tagline">
        Developer, tinkerer, and homelab enthusiast. A new home for my
        <em>writing</em>, <em>projects</em>, and <em>experiments</em> — coming
        soon.
      </p>

      <div class="rule"></div>

      <nav aria-label="Elsewhere">
        <a href="https://github.com/byurhannurula" rel="me noopener" target="_blank">GitHub</a>
        <a href="https://twitter.com/byurhannurula" rel="me noopener" target="_blank">X</a>
        <a href="https://mastodon.social/@byurhannurula" rel="me noopener" target="_blank">Mastodon</a>
        <a href="https://linkedin.com/in/byurhannurula" rel="noopener" target="_blank">LinkedIn</a>
        <a href="mailto:hello@byurhannurula.com">Email</a>
      </nav>

      <footer>&copy; 2026 Byurhan Nurula</footer>
    </main>
  </body>
</html>
