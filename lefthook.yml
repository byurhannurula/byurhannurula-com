# Git hooks, installed by `pnpm install`. Skip once with LEFTHOOK=0 git commit/push.
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{js,mjs,ts,tsx,css,json,jsonc,yml,yaml}'
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint
      glob: '*.{js,mjs,ts,tsx}'
      run: pnpm exec oxlint {staged_files}

pre-push:
  jobs:
    - name: lint
      run: pnpm lint
    - name: format
      run: pnpm format:check
    - name: typecheck
      run: pnpm typecheck
    - name: build
      run: pnpm build
