# Initial docker-compose for SSL certificate generation
# Use this ONLY for first-time SSL setup

services:
  nginx-init:
    image: nginx:alpine
    container_name: portfolio-nginx-init
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx-init.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - portfolio-network

  certbot-init:
    image: certbot/certbot
    container_name: portfolio-certbot-init
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - portfolio-network
    # This will be run manually with docker compose run

networks:
  portfolio-network:
    driver: bridge
